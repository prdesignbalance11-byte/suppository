<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Duro Platform — Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="portal">

  <!-- ============== SIDEBAR ============== -->
  <aside class="side">
    <a class="logo" href="index.html"><span class="mark">CD</span> CD&nbsp;Tech</a>

    <div class="role-switch">
      <label>Signed in as</label>
      <select id="roleSelect" onchange="setRole(this.value)">
        <option value="supplier">Supplier</option>
        <option value="licensee" selected>Licensee</option>
        <option value="aoreor">AOR / EOR</option>
        <option value="government">Government</option>
        <option value="admin">Platform Admin</option>
      </select>
    </div>

    <nav id="sideNav"><!-- built by JS --></nav>
  </aside>

  <!-- ============== MAIN ============== -->
  <main class="main" id="main"><!-- built by JS --></main>
</div>

<script>
/* =======================================================================
   ACCESS MATRIX — stakeholder × page → access level
   Levels: admin | edit | view | none
   ======================================================================= */
const PAGES = {
  dashboard:    {label:'Dashboard',            icon:'▦', group:'Overview'},
  suppliers:    {label:'Supplier Profile',     icon:'◷', group:'Supplier'},
  inventory:    {label:'Inventory Management',  icon:'▤', group:'Supplier'},
  orders:       {label:'Order Processing',      icon:'⇄', group:'Supplier'},
  licensing:    {label:'License Management',    icon:'❖', group:'Licensee'},
  compliance:   {label:'Compliance Docs',       icon:'✓', group:'Licensee'},
  usage:        {label:'Usage Reporting',       icon:'◫', group:'Licensee'},
  regulatory:   {label:'Regulatory Dashboard',  icon:'⚖', group:'AOR / EOR'},
  approvals:    {label:'Approval Workflows',    icon:'⤴', group:'AOR / EOR'},
  govreport:    {label:'Compliance Reporting',  icon:'▣', group:'Government'},
  audit:        {label:'Audit Trails',          icon:'☰', group:'Government'},
  resources:    {label:'Data Resources',        icon:'⬚', group:'Resources'},
  configurator: {label:'Building Configurator', icon:'◰', group:'Resources', href:'configurator.html'},
  payments:     {label:'Payments & Invoices',   icon:'$', group:'Finance'},
};

const ACCESS = {
  supplier:   {dashboard:'view', suppliers:'edit', inventory:'edit', orders:'edit', licensing:'none',
               compliance:'view', usage:'none', regulatory:'none', approvals:'none', govreport:'none',
               audit:'none', resources:'view', configurator:'view', payments:'view'},
  licensee:   {dashboard:'view', suppliers:'view', inventory:'view', orders:'edit', licensing:'edit',
               compliance:'edit', usage:'edit', regulatory:'none', approvals:'none', govreport:'none',
               audit:'none', resources:'edit', configurator:'edit', payments:'edit'},
  aoreor:     {dashboard:'view', suppliers:'view', inventory:'none', orders:'view', licensing:'view',
               compliance:'view', usage:'view', regulatory:'edit', approvals:'edit', govreport:'view',
               audit:'view', resources:'view', configurator:'view', payments:'none'},
  government: {dashboard:'view', suppliers:'none', inventory:'none', orders:'none', licensing:'view',
               compliance:'view', usage:'view', regulatory:'view', approvals:'view', govreport:'edit',
               audit:'view', resources:'view', configurator:'none', payments:'none'},
  admin:      {dashboard:'admin', suppliers:'admin', inventory:'admin', orders:'admin', licensing:'admin',
               compliance:'admin', usage:'admin', regulatory:'admin', approvals:'admin', govreport:'admin',
               audit:'admin', resources:'admin', configurator:'admin', payments:'admin'},
};

let role = 'licensee';
let activePage = 'dashboard';

function levelOf(p){return ACCESS[role][p]||'none';}
function badge(level){
  const map={admin:'access-admin',edit:'access-edit',view:'access-view',none:'access-none'};
  return `<span class="access-badge ${map[level]}">${level}</span>`;
}

/* ---------------- sidebar ---------------- */
function buildNav(){
  const groups={};
  Object.entries(PAGES).forEach(([k,p])=>{(groups[p.group]=groups[p.group]||[]).push([k,p]);});
  let html='';
  Object.entries(groups).forEach(([g,items])=>{
    html+=`<div class="side-group"><div class="gh">${g}</div>`;
    items.forEach(([k,p])=>{
      const lvl=levelOf(k);
      const locked=lvl==='none';
      const cls=['side-link']; if(k===activePage)cls.push('active'); if(locked)cls.push('locked');
      const onclick=locked?'':`onclick="navTo('${k}')"`;
      const lk=locked?'<span class="lk">🔒</span>':'';
      html+=`<div class="${cls.join(' ')}" ${onclick}><span>${p.icon}</span><span>${p.label}</span>${lk}</div>`;
    });
    html+='</div>';
  });
  document.getElementById('sideNav').innerHTML=html;
}

function setRole(r){role=r;if(levelOf(activePage)==='none')activePage='dashboard';buildNav();render();}
function navTo(k){
  const p=PAGES[k];
  if(p.href){window.location.href=p.href;return;}
  if(levelOf(k)==='none')return;
  activePage=k;buildNav();render();
}

/* ---------------- shared ui helpers ---------------- */
const canEdit=()=>['edit','admin'].includes(levelOf(activePage));
function head(title,sub){
  return `<div class="page-head"><div><h1>${title}</h1><div class="sub">${sub}</div></div>
    <div class="flex">${badge(levelOf(activePage))}
    ${canEdit()?'<button class="btn btn-primary btn-sm" onclick="mockAction()">+ New</button>':''}</div></div>`;
}
function readOnlyNote(){
  return canEdit()?'':`<div class="panel" style="border-style:dashed"><span class="muted">
    👁 You have <b>view</b> access to this page for the <b>${role}</b> role. Editing is disabled.</span></div>`;
}
function mockAction(){alert('Demo action — wire this to the backend API / Stripe / CalcTree.');}

/* ---------------- page renderers ---------------- */
const RENDER = {
  dashboard(){
    return head('Dashboard','Network overview for the '+role+' role')+`
    <div class="stat-row">
      <div class="stat"><div class="v">2,140</div><div class="l">Modules in network</div><div class="d up">▲ 12% MoM</div></div>
      <div class="stat"><div class="v">38</div><div class="l">Active licensees</div><div class="d up">▲ 4 new</div></div>
      <div class="stat"><div class="v">96%</div><div class="l">Compliance pass rate</div><div class="d up">▲ 2%</div></div>
      <div class="stat"><div class="v">$4.2M</div><div class="l">Royalties YTD</div><div class="d up">▲ 18%</div></div>
    </div>
    <div class="panel"><h3>Recent activity</h3>
      <table><thead><tr><th>Item</th><th>Stakeholder</th><th>Type</th><th>Status</th></tr></thead><tbody>
      <tr><td>Order #4821 — 24 modules</td><td>NorthBuild Modular</td><td>Order</td><td><span class="status s-ok">Approved</span></td></tr>
      <tr><td>QA Report — Plant 7</td><td>EOR Review</td><td>Compliance</td><td><span class="status s-pend">Pending</span></td></tr>
      <tr><td>Royalty invoice — May</td><td>Casa Duro Finance</td><td>Payment</td><td><span class="status s-ok">Paid</span></td></tr>
      <tr><td>Design pack v3 — Chassis B</td><td>Resource Library</td><td>Upload</td><td><span class="status s-ok">Published</span></td></tr>
      </tbody></table>
    </div>`;
  },
  suppliers(){
    return head('Supplier Profile','Registration & company profile')+readOnlyNote()+`
    <div class="panel"><h3>Company details</h3>
      <div class="grid grid-2">
        <div class="field"><label>Company name</label><input value="NorthBuild Components Inc." ${canEdit()?'':'disabled'}></div>
        <div class="field"><label>ISO 9001 status</label><input value="Certified — exp. 2027" ${canEdit()?'':'disabled'}></div>
        <div class="field"><label>Facility size (sqft)</label><input value="42,000" ${canEdit()?'':'disabled'}></div>
        <div class="field"><label>Annual capacity (modules)</label><input value="220" ${canEdit()?'':'disabled'}></div>
      </div>
    </div>`;
  },
  inventory(){
    return head('Inventory Management','Prefab elements & module stock')+readOnlyNote()+`

      </tbody></table>

  },
  orders(){
    return head('Order Processing','Production orders across the network')+readOnlyNote()+`
    <div class="panel"><h3>Open orders</h3>
      <table><thead><tr><th>Order</th><th>Buyer</th><th>Modules</th><th>Status</th></tr></thead><tbody>
      <tr><td>#4821</td><td>NorthBuild Modular</td><td>24</td><td><span class="status s-ok">Approved</span></td></tr>
      <tr><td>#4822</td><td>Prairie Prefab</td><td>12</td><td><span class="status s-pend">Pending</span></td></tr>
      <tr><td>#4823</td><td>Atlantic Homes</td><td>40</td><td><span class="status s-pend">Pending</span></td></tr>
      </tbody></table>
    </div>`;
  },
  licensing(){
    return head('License Management','Your Casa Duro licensing agreements')+readOnlyNote()+`
    <div class="panel"><h3>Active license</h3>
      <div class="grid grid-2">
        <div class="field"><label>Tier</label><input value="Multi-Story Modular Builder Licensee" disabled></div>
        <div class="field"><label>Region exclusivity</label><input value="Ontario — Central" ${canEdit()?'':'disabled'}></div>
        <div class="field"><label>Term</label><input value="Annual + Royalty" disabled></div>

      </div>

  },
  compliance(){
    return head('Compliance Documentation','Code-compliance evidence & certifications')+readOnlyNote()+`
    <div class="panel"><h3>Documents</h3>
      <table><thead><tr><th>Document</th><th>Code / Standard</th><th>Reviewer</th><th>Status</th></tr></thead><tbody>
      <tr><td>Structural calc package — Chassis B</td><td>NBC 2020 / CalcTree</td><td>EOR</td><td><span class="status s-ok">Approved</span></td></tr>
      <tr><td>Energy compliance — Climate Zone 6</td><td>NECB</td><td>AOR</td><td><span class="status s-pend">In review</span></td></tr>

      </tbody></table>
    </div>`;
  },
  usage(){
    return head('Usage Reporting','Module production reported for royalties')+readOnlyNote()+`
    <div class="stat-row">
      <div class="stat"><div class="v">312</div><div class="l">Modules YTD</div></div>
      <div class="stat"><div class="v">$312K</div><div class="l">Royalty accrued</div></div>
      <div class="stat"><div class="v">60+</div><div class="l">Capacity / yr</div></div>
      <div class="stat"><div class="v">98%</div><div class="l">On-system rate</div></div>
    </div>
    <div class="panel"><h3>Monthly production</h3>
      <table><thead><tr><th>Month</th><th>Modules</th><th>Royalty</th><th>Status</th></tr></thead><tbody>
      <tr><td>April</td><td>58</td><td>$58,000</td><td><span class="status s-ok">Reported</span></td></tr>
      <tr><td>May</td><td>64</td><td>$64,000</td><td><span class="status s-ok">Reported</span></td></tr>
      <tr><td>June</td><td>41</td><td>$41,000</td><td><span class="status s-pend">Open</span></td></tr>
      </tbody></table>
    </div>`;
  },
  regulatory(){
    return head('Regulatory Compliance Dashboard','AOR / EOR oversight across projects')+readOnlyNote()+`
    <div class="panel"><h3>Projects under review</h3>
      <table><thead><tr><th>Project</th><th>Licensee</th><th>Discipline</th><th>Status</th></tr></thead><tbody>
      <tr><td>Mid-Rise Residential</td><td>NorthBuild Modular</td><td>Structural (EOR)</td><td><span class="status s-pend">In review</span></td></tr>
      <tr><td>Mixed-Use Block</td><td>Prairie Prefab</td><td>Architectural (AOR)</td><td><span class="status s-ok">Stamped</span></td></tr>
      </tbody></table>
    </div>`;
  },
  approvals(){
    return head('Approval Workflows','Stamp & approve submissions')+readOnlyNote()+`
    <div class="panel"><h3>Queue</h3>
      <table><thead><tr><th>Submission</th><th>From</th><th>Action</th></tr></thead><tbody>
      <tr><td>Structural calc — Chassis B</td><td>NorthBuild</td><td>${canEdit()?'<button class="btn btn-primary btn-sm" onclick="mockAction()">Approve / Stamp</button>':'<span class="muted">view only</span>'}</td></tr>
      <tr><td>Energy compliance</td><td>Prairie Prefab</td><td>${canEdit()?'<button class="btn btn-ghost btn-sm" onclick="mockAction()">Request changes</button>':'<span class="muted">view only</span>'}</td></tr>
      </tbody></table>
    </div>`;
  },
  govreport(){
    return head('Compliance Reporting','Government regulatory reporting')+readOnlyNote()+`
    <div class="panel"><h3>Jurisdiction reports</h3>
      <table><thead><tr><th>Report</th><th>Jurisdiction</th><th>Period</th><th>Status</th></tr></thead><tbody>
      <tr><td>Housing delivery summary</td><td>Province of Ontario</td><td>Q2 2026</td><td><span class="status s-ok">Filed</span></td></tr>
      <tr><td>Code-compliance attestation</td><td>City permit office</td><td>Q2 2026</td><td><span class="status s-pend">Draft</span></td></tr>
      </tbody></table>
    </div>`;
  },
  audit(){
    return head('Audit Trails','Immutable record of platform actions')+readOnlyNote()+`
    <div class="panel"><h3>Audit log</h3>
      <table><thead><tr><th>Timestamp</th><th>Actor</th><th>Action</th></tr></thead><tbody>
      <tr><td>2026-06-23 14:02</td><td>EOR · j.smith</td><td>Stamped structural package #CB-104</td></tr>
      <tr><td>2026-06-23 11:40</td><td>Licensee · NorthBuild</td><td>Reported 12 modules for royalty</td></tr>
      <tr><td>2026-06-22 16:18</td><td>Admin · system</td><td>Published Design pack v3</td></tr>
      </tbody></table>
    </div>`;
  },
  resources(){
    return head('Data Resources','Document repository & material uploads')+readOnlyNote()+`
    ${canEdit()?`<div class="panel"><h3>Upload material</h3>
      <div class="dropzone" onclick="mockAction()"><div class="big">⬆</div>
        <div style="margin-top:8px">Drop production drawings, BOMs, QA docs or design packs here</div>
        <div class="faint" style="font-size:12px;margin-top:4px">PDF, DWG, IFC, XLSX · up to 250 MB</div></div></div>`:''}
    <div class="panel"><h3>Repository</h3>
      <table><thead><tr><th>File</th><th>Type</th><th>Owner</th><th></th></tr></thead><tbody>
      <tr><td>Chassis-B production drawings</td><td>DWG</td><td>Casa Duro</td><td><button class="btn btn-ghost btn-sm" onclick="mockAction()">Download</button></td></tr>
      <tr><td>Optimized BOM — Wall system</td><td>XLSX</td><td>Casa Duro</td><td><button class="btn btn-ghost btn-sm" onclick="mockAction()">Download</button></td></tr>
      <tr><td>QA / QC inspection SOP</td><td>PDF</td><td>Casa Duro</td><td><button class="btn btn-ghost btn-sm" onclick="mockAction()">Download</button></td></tr>
      <tr><td>Design library — Single Family</td><td>IFC</td><td>Casa Duro</td><td><button class="btn btn-ghost btn-sm" onclick="mockAction()">Download</button></td></tr>
      </tbody></table>

  },
  payments(){
    return head('Payments & Invoices','Transactions, invoices & financial reporting')+readOnlyNote()+`
    <div class="stat-row">
      <div class="stat"><div class="v">$64,000</div><div class="l">Current invoice</div></div>
      <div class="stat"><div class="v">$312K</div><div class="l">Paid YTD</div></div>
      <div class="stat"><div class="v">Net 30</div><div class="l">Terms</div></div>
      <div class="stat"><div class="v">Stripe</div><div class="l">Processor</div></div>
    </div>
    ${canEdit()?`<div class="panel"><h3>Make a payment</h3>
      <div class="grid grid-2">
        <div class="field"><label>Invoice</label><input value="INV-2026-06 · $64,000" disabled></div>
        <div class="field"><label>Method</label><select><option>Visa •••• 4242</option><option>ACH / EFT</option><option>Wire</option></select></div>
      </div>
      <button class="btn btn-primary" onclick="mockAction()">Pay $64,000</button>
      <div class="faint" style="font-size:12px;margin-top:10px">Demo only — connect Stripe / payment gateway to process real transactions.</div>
    </div>`:''}
    <div class="panel"><h3>Payment history</h3>
      <table><thead><tr><th>Invoice</th><th>Period</th><th>Amount</th><th>Status</th></tr></thead><tbody>
      <tr><td>INV-2026-05</td><td>May 2026</td><td>$58,000</td><td><span class="status s-ok">Paid</span></td></tr>
      <tr><td>INV-2026-04</td><td>Apr 2026</td><td>$58,000</td><td><span class="status s-ok">Paid</span></td></tr>

      </tbody></table>
    </div>`;
  },
};

function render(){
  const lvl=levelOf(activePage);
  if(lvl==='none'){
    document.getElementById('main').innerHTML=`<div class="locked-note"><div class="big">🔒</div>
      <h2>No access</h2><p>The <b>${role}</b> role does not have access to <b>${PAGES[activePage].label}</b>.</p></div>`;
    return;
  }
  document.getElementById('main').innerHTML=(RENDER[activePage]||RENDER.dashboard)();
}

/* init */
buildNav();render();
</script>
</body>
</html>
