<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modular Building Configurator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
  :root{
    --bg:#1a1d23; --panel:#22262e; --panel-2:#2a2f38; --line:#343a45;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#4c8dff; --accent-dim:#2f5ea8;
    --good:#3ecf8e; --topbar-h:48px; --status-h:26px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
    font-size:13px;
  }
  .app{display:grid;grid-template-rows:var(--topbar-h) 1fr var(--status-h);height:100vh}

  /* Topbar */
  .topbar{
    display:flex;align-items:center;gap:6px;padding:0 12px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;margin-right:14px}
  .brand i{color:var(--accent);font-size:20px}
  .toolbar{display:flex;align-items:center;gap:4px}
  .tool-btn{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:transparent;border:1px solid transparent;border-radius:6px;
    color:var(--muted);cursor:pointer;padding:5px 9px;font-size:10px;min-width:48px;
    transition:.12s;
  }
  .tool-btn i{font-size:18px}
  .tool-btn:hover{background:var(--panel-2);color:var(--text)}
  .tool-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#fff}
  .spacer{flex:1}
  .topbar .action{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .topbar .action:hover{border-color:var(--accent)}
  .sep{width:1px;height:28px;background:var(--line);margin:0 4px}

  /* Main layout */
  .main{display:grid;grid-template-columns:230px 1fr 270px;overflow:hidden}
  .sidebar{background:var(--panel);overflow-y:auto;display:flex;flex-direction:column}
  .sidebar.left{border-right:1px solid var(--line)}
  .sidebar.right{border-left:1px solid var(--line)}
  .panel-title{
    padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;position:sticky;top:0;background:var(--panel);z-index:1;
  }
  .filter-row{display:flex;gap:4px;padding:8px 10px;flex-wrap:wrap}
  .filter-chip{
    background:var(--panel-2);border:1px solid var(--line);color:var(--muted);
    border-radius:20px;padding:3px 10px;cursor:pointer;font-size:11px;
  }
  .filter-chip.active{background:var(--accent-dim);border-color:var(--accent);color:#fff}

  /* Library */
  #lib-items{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 10px}
  .lib-item{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:8px 6px;text-align:center;cursor:pointer;transition:.12s;
  }
  .lib-item:hover{border-color:var(--accent)}
  .lib-item.active{border-color:var(--accent);background:var(--accent-dim)}
  .lib-icon{font-size:22px;color:var(--accent);margin-bottom:4px}
  .lib-item.active .lib-icon{color:#fff}
  .lib-name{font-size:11px;font-weight:600;line-height:1.2}
  .lib-dim{font-size:10px;color:var(--muted);margin-top:2px}

  /* Viewport */
  .viewport-wrap{position:relative;overflow:hidden;background:#0f1115}
  #viewport{position:absolute;inset:0}
  .vp-hint{
    position:absolute;left:12px;bottom:12px;color:var(--muted);font-size:11px;
    background:rgba(20,22,28,.75);padding:6px 10px;border-radius:6px;
    border:1px solid var(--line);pointer-events:none;line-height:1.6;
  }
  .vp-controls{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
  .vp-controls button{
    width:34px;height:34px;border-radius:7px;background:rgba(34,38,46,.9);
    border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .vp-controls button:hover{border-color:var(--accent)}

  /* Properties */
  #props-content{padding:10px 12px}
  .prop-empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:12px}
  .prop-group{margin-bottom:14px}
  .prop-group h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:8px}
  .prop-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
  .prop-row label{font-size:12px;color:var(--muted);flex:0 0 auto}
  .prop-row input,.prop-row select{
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:5px 8px;font-size:12px;width:110px;
  }
  .prop-row input:focus,.prop-row select:focus{outline:none;border-color:var(--accent)}
  .swatch{width:16px;height:16px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:6px;border:1px solid rgba(255,255,255,.15)}

  /* BOM */
  #bom-cats{padding:6px 10px;overflow-y:auto}
  .bom-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);padding:24px 10px;font-size:12px;text-align:center}
  .bom-cat{margin-bottom:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .bom-cat-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:7px 10px;background:var(--panel-2);font-size:12px;font-weight:600;
  }
  .bom-cat-header i{margin-right:6px;color:var(--accent)}
  .cat-count{background:var(--accent-dim);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
  .bom-cat-body{padding:4px 0}
  .bom-row{display:flex;justify-content:space-between;padding:4px 10px;font-size:12px}
  .bom-row:hover{background:var(--panel-2)}
  .bom-name{color:var(--text)}
  .bom-qty{color:var(--muted)}

  /* Status bar */
  .statusbar{
    display:flex;align-items:center;gap:16px;padding:0 14px;
    background:var(--panel);border-top:1px solid var(--line);
    color:var(--muted);font-size:11px;
  }
  .statusbar .dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block;margin-right:6px}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#3a414d;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <!-- ======================= TOPBAR ======================= -->
  <div class="topbar">
    <div class="brand"><i class="ti ti-building-warehouse"></i><span>ModBuild</span></div>
    <div class="toolbar" id="toolbar">
      <button class="tool-btn" data-tool="select"   onclick="setTool('select')"><i class="ti ti-pointer"></i>Select</button>
      <button class="tool-btn" data-tool="module"    onclick="setTool('module')"><i class="ti ti-box"></i>Module</button>
      <div class="sep"></div>
      <button class="tool-btn" data-tool="window"    onclick="setTool('window')"><i class="ti ti-border-outer"></i>Window</button>
      <button class="tool-btn" data-tool="door"      onclick="setTool('door')"><i class="ti ti-door"></i>Door</button>
      <button class="tool-btn" data-tool="extpanel"  onclick="setTool('extpanel')"><i class="ti ti-layout-sidebar"></i>Ext Panel</button>
      <button class="tool-btn" data-tool="intpanel"  onclick="setTool('intpanel')"><i class="ti ti-layout-list"></i>Int Panel</button>
      <button class="tool-btn" data-tool="partition" onclick="setTool('partition')"><i class="ti ti-separator"></i>Partition</button>
      <div class="sep"></div>
      <button class="tool-btn" data-tool="section"   onclick="setTool('section')"><i class="ti ti-slice"></i>Section</button>
    </div>
    <div class="spacer"></div>
    <button class="action" onclick="zoomToFit()"><i class="ti ti-maximize"></i>Fit</button>
    <button class="action" onclick="clearScene()"><i class="ti ti-trash"></i>Clear</button>
    <button class="action" onclick="exportBOM()"><i class="ti ti-file-spreadsheet"></i>Export BOM</button>
  </div>

  <!-- ======================= MAIN ======================= -->
  <div class="main">
    <!-- LEFT: component library -->
    <div class="sidebar left">
      <div class="panel-title"><i class="ti ti-library"></i>Component Library</div>
      <div class="filter-row" id="lib-filters">
        <span class="filter-chip active" data-filter="" onclick="setLibFilter('')">All</span>
        <span class="filter-chip" data-filter="window" onclick="setLibFilter('window')">Windows</span>
        <span class="filter-chip" data-filter="door" onclick="setLibFilter('door')">Doors</span>
        <span class="filter-chip" data-filter="panel" onclick="setLibFilter('panel')">Panels</span>
      </div>
      <div id="lib-items"></div>
    </div>

    <!-- CENTER: 3D viewport -->
    <div class="viewport-wrap">
      <div id="viewport"></div>
      <div class="vp-controls">
        <button title="Zoom to fit (Shift+Z)" onclick="zoomToFit()"><i class="ti ti-maximize"></i></button>
        <button title="Top view" onclick="setView('top')"><i class="ti ti-arrow-down"></i></button>
        <button title="Front view" onclick="setView('front')"><i class="ti ti-arrow-up"></i></button>
        <button title="Iso view" onclick="setView('iso')"><i class="ti ti-cube"></i></button>
      </div>
      <div class="vp-hint">
        <b>Orbit</b> drag · <b>Pan</b> shift+drag / middle · <b>Zoom</b> scroll<br>
        Pick a tool, then click the ground to place modules
      </div>
    </div>

    <!-- RIGHT: properties + BOM -->
    <div class="sidebar right">
      <div class="panel-title"><i class="ti ti-adjustments"></i>Properties</div>
      <div id="props-content"></div>
      <div class="panel-title"><i class="ti ti-list-details"></i>Bill of Materials</div>
      <div id="bom-cats"></div>
    </div>
  </div>

  <!-- ======================= STATUS BAR ======================= -->
  <div class="statusbar">
    <span><span class="dot"></span><span id="status-msg">Ready</span></span>
    <span id="status-tool">Tool: Select</span>
    <span id="status-count">Objects: 0</span>
    <span class="spacer" style="flex:1"></span>
    <span>Units: meters</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* ============================================================
   DATA: materials, windows, doors, panels
   ============================================================ */
const MATERIALS = {
  steel:   {name:'Steel Cladding',   color:0x9aa3ad},
  alu:     {name:'Aluminium',        color:0xc4ccd4},
  timber:  {name:'Timber',           color:0xc89b6a},
  concrete:{name:'Concrete Panel',   color:0x8d9094},
  glass:   {name:'Glazed',           color:0x88c0e0},
  composite:{name:'Composite',       color:0x6f7a86},
};

const WINDOW_TYPES = [
  {id:'win-s', name:'Small',   label:'0.9×1.2m', w:0.9, h:1.2},
  {id:'win-m', name:'Medium',  label:'1.2×1.5m', w:1.2, h:1.5},
  {id:'win-l', name:'Large',   label:'1.8×1.5m', w:1.8, h:1.5},
  {id:'win-f', name:'Floor',   label:'2.4×2.4m', w:2.4, h:2.4},
];
const DOOR_TYPES = [
  {id:'dr-s',  name:'Single',  label:'0.9×2.1m', w:0.9, h:2.1},
  {id:'dr-d',  name:'Double',  label:'1.8×2.1m', w:1.8, h:2.1},
  {id:'dr-slide',name:'Sliding',label:'2.4×2.1m', w:2.4, h:2.1},
];
const PANEL_TYPES = [
  {id:'pn-std', name:'Standard', label:'1.2×3.0m', w:1.2, h:3.0, material:'steel'},
  {id:'pn-wide',name:'Wide',     label:'2.4×3.0m', w:2.4, h:3.0, material:'composite'},
  {id:'pn-glass',name:'Glazed',  label:'1.2×3.0m', w:1.2, h:3.0, material:'glass'},
];

/* default module footprint */
const DEFAULT_MODULE = {w:3, l:6, h:3};

/* ============================================================
   STATE
   ============================================================ */
let scene, camera, renderer, raycaster, groundPlane, gridHelper;
let objects = [];                 // placed objects {type,mesh,w,l,h,...}
let currentTool = 'select';
let activeLibItem = null;
let libFilter = '';
let selected = null;
let objCounter = 0;

/* camera orbit state */
const cam = {target:new THREE.Vector3(0,1.5,0), radius:18, theta:0.9, phi:1.0};

/* ============================================================
   TOOL SYSTEM
   ============================================================ */
function setTool(tool){
  currentTool = tool;
  document.querySelectorAll('.tool-btn').forEach(b=>b.classList.toggle('active', b.dataset.tool===tool));
  document.getElementById('status-tool').textContent = 'Tool: ' + tool.charAt(0).toUpperCase()+tool.slice(1);
  if(tool==='select'){ activeLibItem=null; buildLibrary(); }
  setStatus(tool==='select'?'Select objects to edit':'Click ground to place '+tool);
}

function setLibFilter(f){
  libFilter=f;
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.toggle('active', c.dataset.filter===f));
  buildLibrary();
}

/* ============================================================
   COMPONENT LIBRARY UI
   ============================================================ */
function buildLibrary(){
  const filter = libFilter;
  const el=document.getElementById('lib-items');let items=[];
  if(!filter||filter==='window')items.push(...WINDOW_TYPES.map(t=>({...t,cat:'window'})));
  if(!filter||filter==='door')items.push(...DOOR_TYPES.map(t=>({...t,cat:'door'})));
  if(!filter||filter==='panel')items.push(...PANEL_TYPES.map(t=>({...t,cat:'panel'})));
  const icons={window:'ti-border-outer',door:'ti-door',panel:'ti-layout-sidebar'};
  el.innerHTML=items.map(item=>`<div class="lib-item ${activeLibItem?.id===item.id?'active':''}" onclick="selectLibItem('${item.id}','${item.cat}')"><div class="lib-icon"><i class="ti ${icons[item.cat]||'ti-box'}"></i></div><div class="lib-name">${item.name}</div><div class="lib-dim">${item.label}</div></div>`).join('');
}
function selectLibItem(id,cat){
  const all=[...WINDOW_TYPES,...DOOR_TYPES,...PANEL_TYPES];
  activeLibItem=all.find(t=>t.id===id)||null;
  if(cat==='window'&&currentTool!=='window')setTool('window');
  else if(cat==='door'&&currentTool!=='door')setTool('door');
  else if(cat==='panel'&&currentTool!=='extpanel')setTool('extpanel');
  buildLibrary();
}

/* ============================================================
   THREE.JS SETUP
   ============================================================ */
function initThree(){
  const wrap=document.getElementById('viewport');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x0f1115);
  scene.fog=new THREE.Fog(0x0f1115, 40, 90);

  camera=new THREE.PerspectiveCamera(50, wrap.clientWidth/wrap.clientHeight, 0.1, 1000);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.shadowMap.enabled=true;
  wrap.appendChild(renderer.domElement);

  // lights
  const amb=new THREE.AmbientLight(0xffffff,0.55); scene.add(amb);
  const sun=new THREE.DirectionalLight(0xffffff,0.9);
  sun.position.set(12,20,8); sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-30;sun.shadow.camera.right=30;
  sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xaaccff,0x223344,0.4));

  // ground
  const groundGeo=new THREE.PlaneGeometry(200,200);
  const groundMat=new THREE.MeshStandardMaterial({color:0x171a20,roughness:1});
  groundPlane=new THREE.Mesh(groundGeo,groundMat);
  groundPlane.rotation.x=-Math.PI/2; groundPlane.receiveShadow=true;
  groundPlane.name='ground';
  scene.add(groundPlane);

  gridHelper=new THREE.GridHelper(200,200,0x2a3038,0x20252c);
  scene.add(gridHelper);

  raycaster=new THREE.Raycaster();
  updateCamera();

  // events
  const c=renderer.domElement;
  c.addEventListener('pointerdown',onPointerDown);
  c.addEventListener('pointermove',onPointerMove);
  c.addEventListener('pointerup',onPointerUp);
  c.addEventListener('wheel',onWheel,{passive:false});
  c.addEventListener('contextmenu',e=>e.preventDefault());
  window.addEventListener('resize',onResize);
  window.addEventListener('keydown',onKeyDown);

  buildLibrary();
  updateProps();
  updateBOM();
  updateCount();
  animate();
}

function updateCamera(){
  cam.phi=Math.max(0.15,Math.min(Math.PI/2-0.02,cam.phi));
  cam.radius=Math.max(4,Math.min(70,cam.radius));
  const x=cam.target.x+cam.radius*Math.sin(cam.phi)*Math.cos(cam.theta);
  const y=cam.target.y+cam.radius*Math.cos(cam.phi);
  const z=cam.target.z+cam.radius*Math.sin(cam.phi)*Math.sin(cam.theta);
  camera.position.set(x,y,z);
  camera.lookAt(cam.target);
}

function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}

function onResize(){
  const wrap=document.getElementById('viewport');
  camera.aspect=wrap.clientWidth/wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth,wrap.clientHeight);
}

/* ============================================================
   NAVIGATION (SketchUp-style orbit / pan / zoom)
   ============================================================ */
const drag={active:false,mode:null,x:0,y:0};
function onPointerDown(e){
  const wrap=renderer.domElement;
  drag.x=e.clientX;drag.y=e.clientY;
  const orbit=(e.button===0&&e.altKey);
  const pan=(e.button===1)||(e.button===0&&e.shiftKey);
  if(e.button===2||orbit){drag.active=true;drag.mode='orbit';return;}
  if(pan){drag.active=true;drag.mode='pan';return;}
  if(e.button===0){ handleLeftClick(e); }
}
function onPointerMove(e){
  if(!drag.active)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX;drag.y=e.clientY;
  if(drag.mode==='orbit'){
    cam.theta-=dx*0.005; cam.phi-=dy*0.005; updateCamera();
  }else if(drag.mode==='pan'){
    const panScale=cam.radius*0.0016;
    const right=new THREE.Vector3();camera.getWorldDirection(right);
    right.cross(camera.up).normalize();
    const up=new THREE.Vector3(0,1,0);
    cam.target.addScaledVector(right,-dx*panScale);
    cam.target.addScaledVector(up,dy*panScale);
    updateCamera();
  }
}
function onPointerUp(){drag.active=false;drag.mode=null;}
function onWheel(e){e.preventDefault();cam.radius*=(1+Math.sign(e.deltaY)*0.1);updateCamera();}

function screenToGround(e){
  const r=renderer.domElement.getBoundingClientRect();
  const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(m,camera);
  const hit=raycaster.intersectObject(groundPlane);
  return hit.length?hit[0].point:null;
}
function pickObject(e){
  const r=renderer.domElement.getBoundingClientRect();
  const m=new THREE.Vector2(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  raycaster.setFromCamera(m,camera);
  const meshes=objects.map(o=>o.mesh);
  const hit=raycaster.intersectObjects(meshes,true);
  if(!hit.length)return null;
  let mesh=hit[0].object; while(mesh.parent && !mesh.userData.objId) mesh=mesh.parent;
  return objects.find(o=>o.id===mesh.userData.objId)||null;
}

/* ============================================================
   PLACEMENT / SELECTION
   ============================================================ */
function handleLeftClick(e){
  if(currentTool==='select'){
    const o=pickObject(e); selectObject(o); return;
  }
  if(currentTool==='section'){ setStatus('Section tool: orbit to inspect (demo)'); return; }
  const pt=screenToGround(e);
  if(!pt)return;
  // snap to 0.5m grid
  pt.x=Math.round(pt.x*2)/2; pt.z=Math.round(pt.z*2)/2;
  placeObject(currentTool,pt);
}

function placeObject(type,pt){
  let obj;
  if(type==='module') obj=makeModule(pt);
  else if(type==='window'||type==='door') obj=makeOpening(type,pt);
  else obj=makePanel(type,pt);
  if(!obj)return;
  objects.push(obj);
  scene.add(obj.mesh);
  selectObject(obj);
  updateBOM(); updateCount();
  setStatus('Placed '+type);
}

function makeModule(pt){
  const {w,l,h}=DEFAULT_MODULE;
  const geo=new THREE.BoxGeometry(w,h,l);
  const mat=new THREE.MeshStandardMaterial({color:0x4a5260,roughness:0.7,metalness:0.1,transparent:true,opacity:0.92});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(pt.x,h/2,pt.z);
  mesh.castShadow=true;mesh.receiveShadow=true;
  const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x8da2c0}));
  mesh.add(edges);
  const id='obj'+(++objCounter);
  mesh.userData.objId=id;
  return {id,type:'module',mesh,w,l,h,label:`${w}×${l}×${h}m`,baseColor:0x4a5260};
}

function makeOpening(type,pt){
  const def=activeLibItem || (type==='window'?WINDOW_TYPES[1]:DOOR_TYPES[0]);
  const w=def.w,h=def.h;
  const color=type==='window'?0x88c0e0:0x6a4a2a;
  const geo=new THREE.BoxGeometry(w,h,0.12);
  const mat=new THREE.MeshStandardMaterial({color,roughness:type==='window'?0.1:0.6,metalness:0.1,
      transparent:type==='window',opacity:type==='window'?0.5:1});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(pt.x, h/2, pt.z);
  mesh.castShadow=true;
  const id='obj'+(++objCounter);
  mesh.userData.objId=id;
  return {id,type,mesh,w,h,libItem:def.id,label:def.name};
}

function makePanel(type,pt){
  const def=activeLibItem||PANEL_TYPES[0];
  const w=def.w||1.2,h=def.h||3.0;
  const material=def.material||(type==='partition'?'composite':'steel');
  const geo=new THREE.BoxGeometry(w,h,0.12);
  const mat=new THREE.MeshStandardMaterial({color:MATERIALS[material].color,roughness:0.6,metalness:0.2,
      transparent:material==='glass',opacity:material==='glass'?0.45:1});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(pt.x,h/2,pt.z);
  mesh.castShadow=true;mesh.receiveShadow=true;
  const id='obj'+(++objCounter);
  mesh.userData.objId=id;
  const labels={extpanel:'Ext. Panel',intpanel:'Int. Panel',partition:'Partition'};
  return {id,type,mesh,w,h,material,label:labels[type]||'Panel'};
}

function selectObject(o){
  // clear previous highlight
  if(selected && selected.mesh){
    selected.mesh.children.forEach(ch=>{if(ch.material&&ch.isLineSegments)ch.material.color.setHex(selected.type==='module'?0x8da2c0:0x8da2c0);});
    if(selected.mesh.material) selected.mesh.material.emissive?.setHex(0x000000);
  }
  selected=o;
  if(o && o.mesh && o.mesh.material){
    o.mesh.material.emissive=new THREE.Color(0x223a66);
  }
  updateProps();
}

function deleteSelected(){
  if(!selected)return;
  scene.remove(selected.mesh);
  objects=objects.filter(x=>x!==selected);
  selected=null;
  updateProps();updateBOM();updateCount();
  setStatus('Deleted object');
}

function clearScene(){
  objects.forEach(o=>scene.remove(o.mesh));
  objects=[];selected=null;
  updateProps();updateBOM();updateCount();
  setStatus('Scene cleared');
}

/* ============================================================
   PROPERTIES PANEL
   ============================================================ */
function updateProps(){
  const el=document.getElementById('props-content');
  if(!selected){el.innerHTML='<div class="prop-empty">No object selected.<br>Use the Select tool and click an object.</div>';return;}
  const o=selected;
  let rows='';
  rows+=`<div class="prop-row"><label>Type</label><input value="${o.type}" disabled></div>`;
  rows+=`<div class="prop-row"><label>Width (m)</label><input type="number" step="0.1" value="${o.w}" onchange="editDim('w',this.value)"></div>`;
  if(o.type==='module'){
    rows+=`<div class="prop-row"><label>Length (m)</label><input type="number" step="0.1" value="${o.l}" onchange="editDim('l',this.value)"></div>`;
  }
  rows+=`<div class="prop-row"><label>Height (m)</label><input type="number" step="0.1" value="${o.h}" onchange="editDim('h',this.value)"></div>`;
  rows+=`<div class="prop-row"><label>Rotate</label><input type="number" step="15" value="${Math.round((o.mesh.rotation.y*180/Math.PI))}" onchange="editRot(this.value)"></div>`;
  if(o.material!==undefined && o.type!=='window' && o.type!=='door'){
    const opts=Object.entries(MATERIALS).map(([k,v])=>`<option value="${k}" ${o.material===k?'selected':''}>${v.name}</option>`).join('');
    rows+=`<div class="prop-row"><label>Material</label><select onchange="editMaterial(this.value)">${opts}</select></div>`;
  }
  el.innerHTML=`<div class="prop-group"><h4>${o.label||o.type}</h4>${rows}</div>
    <div class="prop-group"><button class="action" style="width:100%;justify-content:center" onclick="deleteSelected()"><i class="ti ti-trash"></i>Delete</button></div>`;
}

function rebuildMesh(o){
  // rebuild geometry to reflect new dims while keeping position/rotation
  const pos=o.mesh.position.clone(), rot=o.mesh.rotation.clone();
  scene.remove(o.mesh);
  let geo, color, opts={};
  if(o.type==='module'){geo=new THREE.BoxGeometry(o.w,o.h,o.l);color=o.baseColor;opts={transparent:true,opacity:0.92};}
  else if(o.type==='window'){geo=new THREE.BoxGeometry(o.w,o.h,0.12);color=0x88c0e0;opts={transparent:true,opacity:0.5};}
  else if(o.type==='door'){geo=new THREE.BoxGeometry(o.w,o.h,0.12);color=0x6a4a2a;}
  else{geo=new THREE.BoxGeometry(o.w,o.h,0.12);color=MATERIALS[o.material].color;if(o.material==='glass')opts={transparent:true,opacity:0.45};}
  const mat=new THREE.MeshStandardMaterial({color,roughness:0.6,metalness:0.15,...opts});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.copy(pos);mesh.position.y=o.h/2;mesh.rotation.copy(rot);
  mesh.castShadow=true;mesh.receiveShadow=true;
  mesh.userData.objId=o.id;
  if(o.type==='module'){
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x8da2c0})));
  }
  o.mesh=mesh;scene.add(mesh);
}

function editDim(k,v){if(!selected)return;selected[k]=parseFloat(v)||0.1;if(selected.type==='module')selected.label=`${selected.w}×${selected.l}×${selected.h}m`;rebuildMesh(selected);selectObject(selected);updateBOM();}
function editRot(v){if(!selected)return;selected.mesh.rotation.y=(parseFloat(v)||0)*Math.PI/180;}
function editMaterial(v){if(!selected)return;selected.material=v;rebuildMesh(selected);selectObject(selected);updateBOM();}

/* ============================================================
   BILL OF MATERIALS
   ============================================================ */
function updateBOM(){
  const el=document.getElementById('bom-cats');
  const cats={module:{label:'Modules',icon:'ti-box',items:[]},window:{label:'Windows',icon:'ti-border-outer',items:[]},door:{label:'Doors',icon:'ti-door',items:[]},extpanel:{label:'Ext. Panels',icon:'ti-layout-sidebar',items:[]},intpanel:{label:'Int. Panels',icon:'ti-layout-list',items:[]},partition:{label:'Partitions',icon:'ti-separator',items:[]}};
  objects.forEach(o=>{if(cats[o.type])cats[o.type].items.push(o);});
  const populated=Object.entries(cats).filter(([,c])=>c.items.length>0);
  if(!populated.length){el.innerHTML='<div class="bom-empty"><i class="ti ti-box" style="font-size:18px;opacity:0.3"></i>Add modules to generate BOM</div>';return;}
  el.innerHTML=populated.map(([k,cat])=>{const grouped={};cat.items.forEach(o=>{const key=k==='module'?`${o.w}×${o.l}×${o.h}m`:k==='window'||k==='door'?`${o.w}×${o.h}m`:`${(o.w||1.2).toFixed(1)}×${(o.h||3).toFixed(1)}m${o.material?' ('+MATERIALS[o.material]?.name+')':''}`;grouped[key]=(grouped[key]||0)+1;});return `<div class="bom-cat"><div class="bom-cat-header"><span><i class="ti ${cat.icon}"></i>${cat.label}</span><span class="cat-count">${cat.items.length}</span></div><div class="bom-cat-body">${Object.entries(grouped).map(([desc,qty])=>`<div class="bom-row"><span class="bom-name">${desc}</span><span class="bom-qty">×${qty}</span></div>`).join('')}</div></div>`;}).join('');
}

function exportBOM(){
  const rows=[['Category','Description','Width(m)','Height(m)','Depth(m)','Material','Qty']];
  const cats={module:'Module',window:'Window',door:'Door',extpanel:'Exterior Panel',intpanel:'Interior Panel',partition:'Partition'};
  const grouped={};
  objects.forEach(o=>{const cat=cats[o.type]||o.type;let desc,w,h,d,mat;
    if(o.type==='module'){desc=o.label;w=o.w;h=o.h;d=o.l;mat='—';}
    else if(o.type==='window'||o.type==='door'){const t=[...WINDOW_TYPES,...DOOR_TYPES].find(x=>x.id===o.libItem);desc=t?.name||'—';w=o.w;h=o.h;d=0.1;mat='—';}
    else{desc=o.label;w=o.w||1.2;h=o.h||3.0;d=0.12;mat=MATERIALS[o.material]?.name||'—';}
    const key=`${cat}|${desc}|${w}|${h}|${d}|${mat}`;
    if(!grouped[key])grouped[key]={cat,desc,w,h,d,mat,qty:0};grouped[key].qty++;});
  Object.values(grouped).forEach(r=>rows.push([r.cat,r.desc,r.w,r.h,r.d,r.mat,r.qty]));
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='modular_bom.csv';a.click();
  setStatus('Exported BOM ('+(rows.length-1)+' line items)');
}

/* ============================================================
   VIEW / UTILITY
   ============================================================ */
function zoomToFit(){
  if(!objects.length){cam.target.set(0,1.5,0);cam.radius=18;cam.theta=0.9;cam.phi=1.0;updateCamera();return;}
  const box=new THREE.Box3();
  objects.forEach(o=>box.expandByObject(o.mesh));
  const c=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  cam.target.copy(c);
  cam.radius=Math.max(size.x,size.y,size.z)*1.8+6;
  updateCamera();
  setStatus('Zoomed to fit');
}
function setView(v){
  if(v==='top'){cam.theta=Math.PI/2;cam.phi=0.18;}
  else if(v==='front'){cam.theta=Math.PI/2;cam.phi=Math.PI/2-0.05;}
  else{cam.theta=0.9;cam.phi=1.0;}
  updateCamera();
}
function setStatus(m){document.getElementById('status-msg').textContent=m;}
function updateCount(){document.getElementById('status-count').textContent='Objects: '+objects.length;}

function onKeyDown(e){
  if(e.target.tagName==='INPUT')return;
  const map={m:'module',s:'select',w:'window',d:'door',e:'extpanel',i:'intpanel',p:'partition',x:'section'};
  if(map[e.key])setTool(map[e.key]);
  if(e.key==='Delete'||e.key==='Backspace')deleteSelected();
  if(e.key==='Escape')selectObject(null);
  if(e.key==='Z'&&e.shiftKey){zoomToFit();e.preventDefault();}
  if(e.key===' ')e.preventDefault();
}

window.addEventListener('load',()=>setTimeout(initThree,50));
</script>
